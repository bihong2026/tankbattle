# 打坦克联机后台的 nginx 反代 + 限流片段。
#
# 用在什么场景：80 / 443 上**已经有一个站点**在跑时，不要新建 server 块去抢端口，
# 把下面两段分别放进现有的配置里就够了。
#
#   第 1 段（限流区）  -> /etc/nginx/conf.d/tanks-limit.conf
#                        limit_req_zone / limit_conn_zone 只能写在 http 块，
#                        而 conf.d 这个目录正好被 nginx.conf 的 include 收进 http 块。
#   第 2 段（location）-> 已有站点的 server 块里，见下面的注释示例
#
# 改完：sudo nginx -t && sudo systemctl reload nginx
#
# 后端只监听 127.0.0.1:9010，靠这里挂到 80 端口的 /tanks/ 路径上。
# 插件的「服务器地址」填 http://<域名或公网IP>/tanks（末尾不要斜杠，宿主半会自己接 /api/...）。

# ============================================================ 第 1 段：限流区
# 数值怎么来的：这套联机是轮询式的，一桌两个玩家各自 33~40 req/s（房主 60ms 一拍、
# 客人 50ms 一拍，各两个请求），合计约 73 req/s。阈值必须**明显高于 73**，否则罚的是
# 正常玩家 —— 第一版设 40r/s 时，一桌客人自己就正好压在线上。
# 实测：72 req/s 打 6 秒，432 个请求全部 200；1200 个请求不限速刷，只放行 548 个。
limit_req_zone  $binary_remote_addr zone=tanks:10m      rate=200r/s;
limit_conn_zone $binary_remote_addr zone=tanksconn:10m;

# =================================================== 第 2 段：location（示例）
# 复制到已有站点的 server 块里，放在 `location / { ... }` 之前：
#
#     # ---- 打坦克联机后台 ----
#     location /tanks/ {
#         limit_req zone=tanks burst=400 nodelay;
#         limit_conn tanksconn 64;
#         # 末尾这个 / 会把 /tanks/ 前缀剥掉，所以 /tanks/api/health -> /api/health
#         proxy_pass http://127.0.0.1:9010/;
#         proxy_http_version 1.1;
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_connect_timeout 5s;
#         proxy_read_timeout 30s;
#     }
#
# 两个坑：
#   1. 备份文件别留在 sites-enabled/ 里 —— 那个目录的文件会被全部加载，一个
#      xxx.bak 就会让 nginx 报「a duplicate default server for 0.0.0.0:80」直接起不来。
#   2. reload 之后立刻 curl 可能拿到 404，那是旧 worker 还没退出，过一秒就好。
